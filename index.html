<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>QuickNote</title>

<!-- PWA / iOS home-screen install -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QuickNote">
<link rel="apple-touch-icon" href="icon.svg">
<!--
  NOTE: iOS's home-screen icon support for SVG apple-touch-icon is
  inconsistent across versions. If the icon doesn't show up after
  Add to Home Screen, swap icon.svg for a real 180x180 PNG here -
  cosmetic only, does not block anything else in the app.
-->

<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body {
    background-color: #050505;
    color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
  .panel-bg { background-color: #121212; }
  .input-bg { background-color: #1a1a1a; }
  .border-subtle { border-color: #262626; }
  textarea { field-sizing: content; }
  [hidden] { display: none !important; }
  .status-dot { width: 8px; height: 8px; border-radius: 9999px; }
  .status-dot.online { background: #10b981; }
  .status-dot.offline { background: #737373; }
  .status-dot.pending { background: #f59e0b; }
</style>
</head>
<body class="h-screen flex flex-col overflow-hidden relative">

  <!-- ============ HEADER ============ -->
  <header class="shrink-0 flex items-center justify-between px-4 py-3 border-b border-subtle panel-bg">
    <div class="flex items-center gap-2">
      <h1 class="text-base font-bold text-white">QuickNote</h1>
      <span id="connStatus" class="status-dot offline" title="Offline"></span>
      <span id="pendingBadge" hidden class="text-[10px] px-1.5 py-0.5 rounded-full bg-amber-950/50 text-amber-400 border border-amber-900/50"></span>
    </div>
    <button id="openSettingsBtn" class="text-neutral-400 hover:text-white p-1" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <!-- ============ MAIN: capture + list ============ -->
  <main class="flex-1 overflow-y-auto">

    <!-- Capture card -->
    <section class="p-4 border-b border-subtle">
      <div class="relative mb-2">
        <input id="personSearchInput" type="text" placeholder="Who is this about? (name or number)"
          class="w-full input-bg border border-subtle rounded-lg px-3 py-2.5 text-sm text-white placeholder-neutral-500 focus:outline-none focus:border-neutral-500"
          autocomplete="off">
        <div id="personResults" hidden
          class="absolute z-10 mt-1 w-full max-h-56 overflow-y-auto panel-bg border border-subtle rounded-lg shadow-xl"></div>
      </div>

      <div id="selectedPersonChip" hidden class="mb-2 inline-flex items-center gap-2 bg-neutral-800 rounded-full pl-3 pr-1 py-1 text-xs text-white">
        <span id="selectedPersonName"></span>
        <button id="clearPersonBtn" class="w-5 h-5 flex items-center justify-center rounded-full hover:bg-neutral-700" aria-label="Clear">&times;</button>
      </div>

      <textarea id="noteText" rows="3" placeholder="Type, or tap the mic on your keyboard to dictate…"
        class="w-full input-bg border border-subtle rounded-lg px-3 py-2.5 text-sm text-white placeholder-neutral-500 focus:outline-none focus:border-neutral-500 resize-none"></textarea>

      <button id="saveNoteBtn" disabled
        class="mt-2 w-full bg-white text-black text-sm font-bold py-2.5 rounded-lg disabled:opacity-30 disabled:cursor-not-allowed active:scale-[0.99] transition-transform">
        Save Note
      </button>
    </section>

    <!-- Notes list -->
    <section id="notesList" class="p-4 space-y-2"></section>

    <div id="emptyState" class="p-8 text-center text-neutral-500 text-sm">
      No notes yet. Pick who this is about and start typing.
    </div>
  </main>

  <!-- ============ SETTINGS MODAL ============ -->
  <div id="settingsModal" hidden class="fixed inset-0 z-50 bg-black/70 flex items-end sm:items-center justify-center p-4">
    <div class="w-full max-w-sm panel-bg border border-subtle rounded-2xl p-5">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-bold text-white">Settings</h2>
        <button id="closeSettingsBtn" class="text-neutral-400 hover:text-white text-xl leading-none">&times;</button>
      </div>

      <label class="block text-xs text-neutral-400 mb-1">Apps Script Web App URL</label>
      <input id="endpointInput" type="url" placeholder="https://script.google.com/macros/s/.../exec"
        class="w-full input-bg border border-subtle rounded-lg px-3 py-2 text-sm text-white mb-3 focus:outline-none focus:border-neutral-500">

      <label class="block text-xs text-neutral-400 mb-1">Access Token</label>
      <input id="tokenInput" type="password" placeholder="paste the token from Script Properties"
        class="w-full input-bg border border-subtle rounded-lg px-3 py-2 text-sm text-white mb-4 focus:outline-none focus:border-neutral-500">

      <button id="saveSettingsBtn" class="w-full bg-white text-black text-sm font-bold py-2.5 rounded-lg mb-2">Save</button>
      <button id="pullPeopleBtn" class="w-full bg-neutral-800 text-white text-sm font-medium py-2.5 rounded-lg mb-2">Pull Contacts Now</button>
      <button id="retrySyncBtn" class="w-full bg-neutral-800 text-white text-sm font-medium py-2.5 rounded-lg">Retry Sync</button>

      <p id="settingsStatus" class="mt-3 text-xs text-neutral-500"></p>
    </div>
  </div>

  <!-- ============ NOTE DETAIL MODAL ============ -->
  <div id="noteDetailModal" hidden class="fixed inset-0 z-50 bg-black/70 flex items-end sm:items-center justify-center p-4">
    <div class="w-full max-w-sm max-h-[85vh] overflow-y-auto panel-bg border border-subtle rounded-2xl p-5">
      <div class="flex items-center justify-between mb-3">
        <h2 id="detailPersonName" class="text-base font-bold text-white"></h2>
        <button id="closeDetailBtn" class="text-neutral-400 hover:text-white text-xl leading-none">&times;</button>
      </div>
      <p id="detailTimestamp" class="text-xs text-neutral-500 mb-3"></p>

      <div class="mb-4">
        <h3 class="text-[11px] uppercase tracking-wide text-neutral-500 mb-1">Raw note</h3>
        <p id="detailRawText" class="text-sm text-neutral-200 whitespace-pre-wrap"></p>
      </div>

      <div id="detailStructuredWrap" hidden class="mb-4">
        <h3 class="text-[11px] uppercase tracking-wide text-neutral-500 mb-1">Structured</h3>
        <pre id="detailStructured" class="text-xs text-neutral-300 whitespace-pre-wrap"></pre>
      </div>

      <div id="detailGmailWrap" hidden>
        <h3 class="text-[11px] uppercase tracking-wide text-neutral-500 mb-1">Gmail context (frozen at save)</h3>
        <div id="detailGmail" class="text-xs text-neutral-400 space-y-1"></div>
      </div>

      <div id="detailPendingNote" class="text-xs text-amber-500 mt-3"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
